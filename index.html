<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rocket Dash</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        canvas {
            background-color: #2c3e50;
            border: 4px solid #ecf0f1;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            cursor: pointer;
        }
        #instructions {
            margin-top: 15px;
            text-align: center;
        }
    </style>
</head>
<body>

    <h2>Rocket Dash</h2>
    <canvas id="gameCanvas" width="800" height="400"></canvas>
    <div id="instructions">
        <p><strong>Hold SPACE, CLICK, or TAP</strong> to fly up. Release to fall.</p>
        <p>Dodge the green obstacles!</p>
    </div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    // Game Variables
    let frames = 0;
    let score = 0;
    let gameOver = false;
    let isFlying = false;

    // Rocket (Player) Object
    const rocket = {
        x: 100,
        y: 200,
        width: 40,
        height: 20,
        velocity: 0,
        gravity: 0.25,      // How fast you fall
        thrust: 0.45,       // How fast you fly up when holding
        maxVelocity: 6,     // Speed limit so you don't go crazy fast
        
        draw: function() {
            ctx.save();
            ctx.translate(this.x, this.y);
            
            // Tilt the rocket based on velocity
            let angle = this.velocity * 3 * (Math.PI / 180);
            ctx.rotate(angle);

            // Draw Rocket Body
            ctx.fillStyle = "#e74c3c"; // Red body
            ctx.fillRect(-this.width/2, -this.height/2, this.width, this.height);
            
            // Draw Window
            ctx.fillStyle = "#3498db";
            ctx.fillRect(0, -this.height/4, 10, 10);

            // Draw Rocket Nose (Triangle)
            ctx.fillStyle = "#f1c40f"; // Yellow nose
            ctx.beginPath();
            ctx.moveTo(this.width/2, -this.height/2);
            ctx.lineTo(this.width/2 + 15, 0);
            ctx.lineTo(this.width/2, this.height/2);
            ctx.fill();

            // Draw Thruster Fire if flying
            if (isFlying) {
                ctx.fillStyle = "#e67e22";
                ctx.beginPath();
                ctx.moveTo(-this.width/2, -this.height/2 + 2);
                ctx.lineTo(-this.width/2 - Math.random() * 20 - 10, 0);
                ctx.lineTo(-this.width/2, this.height/2 - 2);
                ctx.fill();
            }

            ctx.restore();
        },
        
        update: function() {
            // Apply thrust or gravity
            if (isFlying) {
                this.velocity -= this.thrust;
            } else {
                this.velocity += this.gravity;
            }

            // Cap the velocity
            if (this.velocity > this.maxVelocity) this.velocity = this.maxVelocity;
            if (this.velocity < -this.maxVelocity) this.velocity = -this.maxVelocity;

            this.y += this.velocity;

            // Floor and Ceiling Collision (acts as a solid boundary)
            if (this.y + this.height/2 >= canvas.height) {
                this.y = canvas.height - this.height/2;
                this.velocity = 0;
            }
            if (this.y - this.height/2 <= 0) {
                this.y = this.height/2;
                this.velocity = 0;
            }
        }
    };

    // Obstacles Array
    const obstacles = [];

    class Obstacle {
        constructor() {
            this.x = canvas.width;
            this.width = 50;
            this.gap = 130; // Space between top and bottom pillar
            
            // Randomize the gap position
            this.topHeight = Math.random() * (canvas.height - this.gap - 40) + 20;
            this.bottomY = this.topHeight + this.gap;
            this.bottomHeight = canvas.height - this.bottomY;
            this.speed = 4;
            this.passed = false;
        }

        draw() {
            ctx.fillStyle = "#2ecc71"; // Green obstacles
            // Top pillar
            ctx.fillRect(this.x, 0, this.width, this.topHeight);
            // Bottom pillar
            ctx.fillRect(this.x, this.bottomY, this.width, this.bottomHeight);
        }

        update() {
            this.x -= this.speed;

            // Collision Detection
            // Using a slightly smaller hitbox for the rocket to make it fair
            let hitboxLeft = rocket.x - rocket.width/2 + 5;
            let hitboxRight = rocket.x + rocket.width/2 + 10;
            let hitboxTop = rocket.y - rocket.height/2 + 5;
            let hitboxBottom = rocket.y + rocket.height/2 - 5;

            // Check if within X bounds of obstacle
            if (hitboxRight > this.x && hitboxLeft < this.x + this.width) {
                // Check if hitting Top or Bottom pillar
                if (hitboxTop < this.topHeight || hitboxBottom > this.bottomY) {
                    gameOver = true;
                }
            }

            // Score updating
            if (this.x + this.width < rocket.x && !this.passed) {
                score++;
                this.passed = true;
            }
        }
    }

    // Input Listeners (Hold to fly, release to fall)
    function startFlying(e) {
        if (e.type !== 'keydown' || e.code === 'Space') {
            if (gameOver) resetGame();
            else isFlying = true;
            
            // Prevent scrolling on spacebar/touch
            if(e.type === 'keydown' && e.code === 'Space') e.preventDefault();
        }
    }

    function stopFlying(e) {
        if (e.type !== 'keyup' || e.code === 'Space') {
            isFlying = false;
        }
    }

    window.addEventListener("keydown", startFlying);
    window.addEventListener("keyup", stopFlying);
    canvas.addEventListener("mousedown", startFlying);
    canvas.addEventListener("mouseup", stopFlying);
    canvas.addEventListener("touchstart", startFlying, {passive: false});
    canvas.addEventListener("touchend", stopFlying);

    function resetGame() {
        rocket.y = 200;
        rocket.velocity = 0;
        obstacles.length = 0;
        score = 0;
        frames = 0;
        gameOver = false;
        isFlying = false;
    }

    // Main Game Loop
    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (!gameOver) {
            rocket.update();
            rocket.draw();

            // Spawn obstacles every 90 frames
            if (frames % 90 === 0) {
                obstacles.push(new Obstacle());
            }

            for (let i = 0; i < obstacles.length; i++) {
                obstacles[i].update();
                obstacles[i].draw();
            }

            // Remove off-screen obstacles to save memory
            if (obstacles.length > 0 && obstacles[0].x < -50) {
                obstacles.shift();
            }

            // Draw Score
            ctx.fillStyle = "white";
            ctx.font = "30px Arial";
            ctx.fillText("Score: " + score, 20, 40);

            frames++;
        } else {
            // Game Over Screen
            rocket.draw(); // Draw final position
            
            // Draw Obstacles
            for (let i = 0; i < obstacles.length; i++) {
                obstacles[i].draw();
            }

            ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "white";
            ctx.font = "50px Arial";
            ctx.textAlign = "center";
            ctx.fillText("CRASHED!", canvas.width / 2, canvas.height / 2 - 20);
            
            ctx.font = "25px Arial";
            ctx.fillText("Score: " + score, canvas.width / 2, canvas.height / 2 + 20);
            ctx.fillText("Click or Press Space to Restart", canvas.width / 2, canvas.height / 2 + 60);
            ctx.textAlign = "left"; // Reset text align
        }

        requestAnimationFrame(animate);
    }

    // Start Game
    animate();
</script>

</body>
</html>
